<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="conteiner">
        <form action="" method="get">

            <div class="title"><h2>Digite as informações do produto</h2></div>
            <div class="input-area">

                <div class="group nome">
                    <label for="input-nome">Digite o produto</label>
                    <input type="text"  placeholder="Ex.: Camiseta" id="input-name">
                </div>

                <div class="group preco">
                    <label for="input-preco">Digite o preço do produto</label>
                    <input type="number"  placeholder="Ex.: 60" id="input-price">
                </div>
                    
                <div class="group quantidade">
                    <label for="input-quantidade">Digite a quantidade do produto</label>
                    <input type="number"  placeholder="Ex.: 2" id="input-quantity">
                </div>
                
            </div>

            <input type="submit" value="Cadastrar produto" class="button-submit">
            
        </form>

        <div class="res">       
            <div class="head"><p>Chutes</p><p class="chutes-totais">0</p></div>

            <ul>
                <li>
                    <span>Sem produtos cadastrados existentes</span>
                </li>
            </ul>

        </div>

    </div>


    <script src="js/script.js" defer></script>
    
</body>
</html>
