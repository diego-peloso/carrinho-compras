<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="area-conteiner">
        <div class="card conteiner">
            <form action="" method="get" class="main">
                <div class="group-text-fields">

                    <div class="text-field name">
                        <label for="name">Digite o produto</label>
                        <input type="text" placeholder="Ex.: Camiseta" id="name" class="input-form" required>
                    </div>


                    <div class="text-field price">
                        <label for="price">Digite o preço do produto</label>
                        <input type="number" placeholder="Ex.: 60" id="price" class="input-form" required>
                    </div>

                    <div class="text-field quantity">
                        <label for="quantity">Digite a quantidade do produto</label>
                        <input type="number" placeholder="Ex.: 2" id="quantity" class="input-form" required>
                    </div>

                </div>

                <input type="submit" value="Pedir produto" class="btn button-submit">

            </form>
        </div>
        <div class="card res">
            <div class="group">
            <div class="head">
                <p>Produtos</p>
                <div class="order-quantity">
                    <p class="quantity">0</p>
                </div>
            </div>

            <ul class="list">
                <li class="placeholder" ><p>Nenhum item adicionado anida</p></li>
            </ul>
            </div>
            <button class="btn">Calcular Pedido</button>
        </div>
    </div>

    <script src="js/script.js" defer></script>

</body>

</html>
